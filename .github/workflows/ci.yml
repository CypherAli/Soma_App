name: mobile-ci
on:
  push:
  pull_request:
jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run verify:offline
      - run: npm run viewer:check
      - run: npm run export:android
      - run: npm run export:web
